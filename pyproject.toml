[project]
name = "senior-menu-preference"
version = "0.1.0"
description = "养老膳食菜单改版的偏好证据与营养覆盖情景的业务数据服务"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.6", "scipy==1.15.3"]

[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["meals"]

[tool.unittest]
start-directory = "tests"
